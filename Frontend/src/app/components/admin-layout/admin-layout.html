<div class="dashboard-wrapper">
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="logo-box pointer-cursor" (click)="navigateTo('/')">
            <img src="/assets/buswhite.png" alt="Logo" style="height: 40px; margin-right: 10px;">
            <span class="logo-text">System Admin</span>
        </div>
        <nav class="nav-links">
            <a routerLink="/homepage" routerLinkActive="active" title="Trang chủ"><i class="fas fa-home"></i></a>
            <a routerLink="/user-management" routerLinkActive="active" title="Quản lý tài khoản"><i class="fas fa-users-cog"></i></a>
            <a routerLink="/route" routerLinkActive="active" title="Quản lý tuyến đường"><i class="fas fa-map-marked-alt"></i></a>
            <a routerLink="/bus" routerLinkActive="active" title="Quản lý xe khách"><i class="fas fa-bus"></i></a>
            <a routerLink="/trip" routerLinkActive="active" title="Quản lý chuyến đi"><i class="fas fa-calendar-check"></i></a>
            <a routerLink="/dashboard" routerLinkActive="active" title="Báo cáo thống kê"><i class="fas fa-chart-line"></i></a>
        </nav>
        <div class="logout">
            <a (click)="navigateTo('/login')"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </aside>

    <!-- Main Content AREA -->
    <main class="main-content">
        <header class="top-nav">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search resources...">
            </div>
            <div class="nav-actions">
                <span class="dropdown">Admin Panel <i class="fas fa-chevron-down"></i></span>
                <button class="btn-profile">
                    <img src="https://i.pravatar.cc/150?img=33" alt="Admin" class="avatar-small">
                    <span>Admin</span>
                </button>
            </div>
        </header>

        <!-- PAGE CONTENT WILL BE RENDERED HERE -->
        <div class="content-body">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
