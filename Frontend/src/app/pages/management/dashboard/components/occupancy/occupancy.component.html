<div class="occupancy-section" *ngIf="occupancyReport">
    <div class="occupancy-header">
        <div class="header-left">
            <h3><i class="fas fa-users mr-3 text-emerald-500"></i>Hiệu suất lấp đầy hành trình</h3>
            <p>Tỷ lệ trung bình: <span class="font-bold text-emerald-600">{{ occupancyReport.averageOccupancy }}%</span></p>
        </div>
        <span class="view-all">Chi tiết <i class="fas fa-arrow-right ml-2"></i></span>
    </div>
    
    <div class="occupancy-list">
        <div class="occupancy-item" *ngFor="let trip of occupancyReport.trips.slice(0, 3)">
            <div class="item-info">
                <div class="route-info">
                    <span class="bus-badge">{{ trip.busPlate }}</span>
                    <span class="route-name text-slate-700 font-medium">{{ trip.routeName }}</span>
                </div>
                <span class="departure">{{ trip.departureTime | date:'dd/MM HH:mm' }}</span>
            </div>
            <div class="progress-wrapper">
                <div class="progress-track">
                    <div class="progress-fill" [style.width.%]="trip.occupancyPercentage" 
                         [ngClass]="trip.occupancyPercentage > 80 ? 'bg-emerald-500' : (trip.occupancyPercentage > 40 ? 'bg-sky-500' : 'bg-slate-400')">
                    </div>
                </div>
                <span class="progress-label">{{ trip.bookedSeats }}/{{ trip.totalSeats }} ghế ({{ trip.occupancyPercentage }}%)</span>
            </div>
        </div>
    </div>
</div>
