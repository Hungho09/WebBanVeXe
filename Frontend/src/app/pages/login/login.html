<div class="auth-container">
  <div class="auth-card">
    <div class="auth-left">
      <div class="logo pointer-cursor" (click)="navigateTo('/')">
        <img src="/assets/bus.png" alt="Logo" class="auth-logo-img" style="height: 45px;">
        <span style="font-family: Arial; font-weight: 800; font-size: 1.4rem; color: var(--primary-color); margin-left: 10px;">Codenhalam</span>
      </div>

      <h2>Chào mừng trở lại</h2>
      <p class="subtitle">Đăng nhập ngay để theo dõi các chuyến đi của bạn.</p>

      <form (submit)="onLogin($event)">
        <div class="form-group">
          <label>Tên tài khoản</label>
          <input type="text" name="userName" [(ngModel)]="loginData.userName" placeholder="Nhập tên tài khoản" required>
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Đang xác thực...' : 'Đăng nhập ngay' }}
        </button>

        <p class="auth-footer">
          Chưa có tài khoản? <a (click)="navigateTo('/register')" class="pointer-cursor">Đăng ký mới</a>
        </p>
      </form>
    </div>

    <!-- Right Section -->
    <div class="auth-right">
      <div class="illustration-box">
         <img src="/assets/login.png" alt="Login Illustration" class="auth-illustration">
      </div>
      <div class="overlay-text">
        <h3>Bắt đầu hành trình!</h3>
        <p>Tìm kiếm và đặt vé xe, tàu, máy bay dễ dàng chỉ trong vài giây.</p>
      </div>
    </div>
  </div>
</div>
