<!-- ========================================================
     homepage.html — Root template trang chủ
     Cấu trúc 3 tầng: HEADER | MAIN | FOOTER
     Mỗi section là một component độc lập tái sử dụng được
     ======================================================== -->
<div class="homepage-wrapper">

    <!-- ① HEADER — Navbar trang chủ -->
    <app-navbar
        [isScrolled]="isScrolled"
        [currentUser]="currentUser"
        (logoutEvent)="logout()">
    </app-navbar>

    <!-- ② MAIN — Các section nội dung chính -->
    <main class="main-content">

        <!-- 2a. Hero + Search Box -->
        <app-hero-search
            [bgImageUrl]="bgImageUrl"
            (searchEvent)="onTripSearch($event)">
        </app-hero-search>

        <div *ngIf="tripSearchError" class="container text-center p-4 bg-red-50 text-red-600 rounded-xl mt-4">
            <i class="fas fa-exclamation-circle mr-2"></i> {{ tripSearchError }}
        </div>

        <!-- 2b. Tuyến Đường Phổ Biến -->
        <app-popular-routes
            [routes]="cmsConfig?.popularRoutes || []">
        </app-popular-routes>

        <!-- 2c. Ưu Đãi + Thông Báo -->
        <app-offers-news
            [promos]="cmsConfig?.promos || []"
            [notices]="cmsConfig?.notices || []">
        </app-offers-news>

        <!-- 2d. Đánh Giá Khách Hàng -->
        <app-testimonials
            [testimonials]="cmsConfig?.testimonials || []">
        </app-testimonials>

    </main>

    <!-- ③ FOOTER -->
    <app-footer></app-footer>

</div>
