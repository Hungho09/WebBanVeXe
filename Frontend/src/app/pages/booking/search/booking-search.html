<div class="search-page-wrapper">
    <div class="container">
        
        <!-- Top Mini Search Bar -->
        <app-search-header-mini 
            [origin]="origin" 
            [destination]="destination" 
            [date]="date"
            (searchChange)="onHeaderUpdate($event)">
        </app-search-header-mini>

        <div class="search-layout">
            
            <!-- Left Sidebar -->
            <aside class="search-sidebar">
                <app-search-filter-sidebar 
                    [companies]="distinctCompanies"
                    (sortChange)="onSortChange($event)"
                    (filterChange)="onFilterChange($event)">
                </app-search-filter-sidebar>
            </aside>

            <!-- Main Results -->
            <main class="search-results-main">
                
                <div class="results-info" *ngIf="!isLoading">
                    <span class="count">{{ filteredTrips.length }} kết quả chuyến xe cáp phù hợp</span>
                    <p class="route-label">{{ origin }} → {{ destination }} ({{ date | date:'dd/MM/yyyy' }})</p>
                </div>

                <!-- Loading State -->
                <div class="loading-spinner" *ngIf="isLoading">
                    <i class="fas fa-spinner fa-spin"></i> Đang tìm kiếm những chuyến đi tốt nhất...
                </div>

                <!-- Empty State -->
                <div class="empty-state card" *ngIf="!isLoading && filteredTrips.length === 0">
                    <img src="/assets/no-result.png" alt="Nothing found">
                    <h3>Rất tiếc, không tìm thấy chuyến phù hợp</h3>
                    <p>Bạn hãy thử thay đổi bộ lọc hoặc ngày đi khác nhé.</p>
                </div>

                <!-- Results List -->
                <div class="trips-list" *ngIf="!isLoading">
                    <app-search-result-card 
                        *ngFor="let trip of filteredTrips" 
                        [trip]="trip"
                        (selectTrip)="onSelectTrip($event)">
                    </app-search-result-card>
                </div>

            </main>

        </div>
    </div>
</div>
