<!-- Left Sidebar -->
<aside class="sidebar">
    <div class="logo-box pointer-cursor" (click)="navigateTo('/')">
        <img src="/assets/buswhite.png" alt="Logo">
    </div>
    <nav class="nav-links">
        <a routerLink="/homepage" routerLinkActive="active" title="Trang chủ"><i class="fas fa-home"></i></a>
        <a routerLink="/user-management" routerLinkActive="active" title="Quản lý tài khoản"><i class="fas fa-users-cog"></i></a>
        <a routerLink="/route" routerLinkActive="active" title="Quản lý tuyến đường"><i class="fas fa-map-marked-alt"></i></a>
        <a routerLink="/bus" routerLinkActive="active" title="Quản lý xe khách"><i class="fas fa-bus"></i></a>
        <a routerLink="/trip" routerLinkActive="active" title="Quản lý chuyến đi"><i class="fas fa-calendar-check"></i></a>
        <a routerLink="/cms-management" routerLinkActive="active" title="Quản lý CMS Trang Chủ" *ngIf="isAdmin"><i class="fas fa-edit"></i></a>
        <a routerLink="/dashboard" routerLinkActive="active" title="Báo cáo thống kê"><i class="fas fa-chart-line"></i></a>
    </nav>
    <div class="logout">
        <a (click)="logout()" class="pointer-cursor"><i class="fas fa-sign-out-alt"></i></a>
    </div>
</aside>
