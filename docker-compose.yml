# Chạy API trên Mac (Apple Silicon): SQLite trong volume, tự migrate + seed demo.
# Lý do không dùng SQL Server container: migration trong repo đang là SQLite (TEXT/INTEGER).

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5048:8080"
    volumes:
      - vexe-sqlite-data:/data

volumes:
  vexe-sqlite-data:
